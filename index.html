<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>DIBS – Found it. Claimed it. Built it.</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
<script src="https://thunkable.github.io/webviewer-extension/thunkableWebviewerExtension.js" type="text/javascript"></script>
<style>
  :root {
    --bg: #0e0f11; --surface: #17191d; --surface2: #1e2126; --surface3: #252930;
    --border: #2a2d34; --accent: #3DDC84; --accent-dim: rgba(61,220,132,0.12);
    --accent-hover: #34c876; --orange: #f59e0b; --orange-dim: rgba(245,158,11,0.15);
    --red: #ef4444; --red-dim: rgba(239,68,68,0.12); --muted: #6b7280; --muted2: #9ca3af;
    --text: #f1f3f5; --text2: #c9d1d9; --radius: 16px; --radius-sm: 10px; --radius-xs: 6px;
    --shadow: 0 4px 24px rgba(0,0,0,0.4); --font: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
  }
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; background: var(--bg); color: var(--text); font-family: var(--font); font-size: 15px; line-height: 1.5; -webkit-font-smoothing: antialiased; overscroll-behavior: none; }
  #app { max-width: 440px; margin: 0 auto; height: 100dvh; display: flex; flex-direction: column; position: relative; overflow: hidden; }
  .screen { flex: 1; overflow-y: auto; overflow-x: hidden; padding-bottom: 16px; display: none; -webkit-overflow-scrolling: touch; scrollbar-width: none; }
  .screen::-webkit-scrollbar { display: none; }
  .screen.active { display: block; }
  .top-bar { position: sticky; top: 0; z-index: 50; background: var(--bg); padding: 16px 20px 12px; border-bottom: 1px solid var(--border); backdrop-filter: blur(20px); }
  .logo-row { display: flex; align-items: center; gap: 10px; margin-bottom: 14px; }
  .logo-mark { width: 34px; height: 34px; background: var(--accent); border-radius: 9px; display: flex; align-items: center; justify-content: center; font-weight: 900; font-size: 14px; color: #0a0a0a; flex-shrink: 0; }
  .logo-text { font-size: 22px; font-weight: 800; letter-spacing: -0.8px; }
  .logo-text span { color: var(--accent); }
  .logo-sub { font-size: 11px; color: var(--muted); margin-top: -2px; }
  .chips { display: flex; gap: 8px; overflow-x: auto; scrollbar-width: none; padding: 2px 0; }
  .chips::-webkit-scrollbar { display: none; }
  .chip { flex-shrink: 0; padding: 6px 14px; border-radius: 50px; font-size: 13px; font-weight: 600; cursor: pointer; border: 1.5px solid var(--border); background: var(--surface2); color: var(--muted2); transition: all 0.18s ease; user-select: none; }
  .chip.active, .chip:hover { background: var(--accent-dim); border-color: var(--accent); color: var(--accent); }
  .card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: 16px; margin: 0 16px 12px; animation: fadeSlide 0.3s ease both; }
  @keyframes fadeSlide { from { opacity: 0; transform: translateY(10px);} to { opacity: 1; transform: translateY(0);} }
  .card-header { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 8px; }
  .card-title { font-size: 16px; font-weight: 700; letter-spacing: -0.3px; line-height: 1.3; }
  .card-meta { font-size: 12px; color: var(--muted); margin-top: 2px; }
  .cat-badge { padding: 4px 10px; border-radius: 50px; font-size: 11px; font-weight: 700; flex-shrink: 0; }
  .cat-Holz { background: rgba(161,110,60,0.2); color: #c8894a; }
  .cat-Metall { background: rgba(100,116,139,0.2); color: #94a3b8; }
  .cat-Kunststoff { background: rgba(99,102,241,0.2); color: #a5b4fc; }
  .cat-Textil { background: rgba(236,72,153,0.2); color: #f9a8d4; }
  .cat-Sonstiges { background: rgba(107,114,128,0.2); color: #9ca3af; }
  .card-qty { display: flex; align-items: center; gap: 6px; font-size: 13px; font-weight: 600; color: var(--muted2); margin: 8px 0 14px; }
  .btn-claim { width: 100%; background: var(--accent); color: #0a0a0a; border: none; border-radius: 12px; padding: 13px; font-size: 15px; font-weight: 700; cursor: pointer; font-family: var(--font); }
  .btn-claim.sent { background: var(--surface3); color: var(--accent); border: 1.5px solid var(--accent); cursor: default; }
  .section-pad { padding: 16px 20px 8px; }
  .section-label { font-size: 11px; font-weight: 700; letter-spacing: 1px; color: var(--muted); text-transform: uppercase; }
  .form-wrap { padding: 8px 16px 20px; }
  .form-screen-header { padding: 16px 20px 0; margin-bottom: 4px; }
  .screen-title { font-size: 24px; font-weight: 800; letter-spacing: -0.7px; }
  .screen-sub { font-size: 13px; color: var(--muted); margin-top: 4px; }
  .form-group { margin-bottom: 14px; }
  .form-label { font-size: 12px; font-weight: 700; color: var(--muted2); letter-spacing: 0.5px; text-transform: uppercase; margin-bottom: 6px; display: block; }
  .form-input, .form-select, .form-textarea { width: 100%; background: var(--surface); border: 1.5px solid var(--border); border-radius: var(--radius-sm); padding: 13px 14px; font-size: 15px; font-family: var(--font); color: var(--text); appearance: none; outline: none; }
  .form-input:focus, .form-select:focus, .form-textarea:focus { border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-dim); }
  .form-textarea { resize: none; min-height: 90px; }
  .form-row { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .btn-primary { width: 100%; background: var(--accent); color: #0a0a0a; border: none; border-radius: var(--radius-sm); padding: 16px; font-size: 16px; font-weight: 800; cursor: pointer; font-family: var(--font); display: flex; align-items: center; justify-content: center; gap: 8px; margin-top: 6px; }
  .my-post-card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: 14px 16px; margin: 0 16px 10px; animation: fadeSlide 0.3s ease both; }
  .mp-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 6px; }
  .mp-title { font-size: 15px; font-weight: 700; }
  .status-pill { padding: 3px 10px; border-radius: 50px; font-size: 11px; font-weight: 700; }
  .status-verfügbar { background: rgba(61,220,132,0.15); color: var(--accent); }
  .status-reserviert { background: var(--orange-dim); color: var(--orange); }
  .status-abgeholt { background: rgba(107,114,128,0.15); color: var(--muted2); }
  .mp-meta { font-size: 12px; color: var(--muted); margin-bottom: 10px; }
  .mp-actions { display: flex; gap: 8px; }
  .btn-sm { padding: 7px 14px; border-radius: var(--radius-xs); font-size: 12px; font-weight: 600; cursor: pointer; font-family: var(--font); border: 1.5px solid var(--border); background: var(--surface2); color: var(--muted2); }
  .btn-sm.danger:hover { border-color: var(--red); color: var(--red); background: var(--red-dim); }
  .btn-sm.advance { border-color: var(--accent); color: var(--accent); background: var(--accent-dim); }
  .profile-header { padding: 28px 20px 20px; text-align: center; border-bottom: 1px solid var(--border); margin-bottom: 16px; }
  .avatar { width: 80px; height: 80px; border-radius: 50%; background: linear-gradient(135deg, var(--accent-dim) 0%, rgba(61,220,132,0.3) 100%); border: 3px solid var(--accent); display: flex; align-items: center; justify-content: center; margin: 0 auto 14px; font-size: 28px; font-weight: 800; color: var(--accent); }
  .profile-name { font-size: 22px; font-weight: 800; margin-bottom: 3px; }
  .profile-meta { font-size: 13px; color: var(--muted); font-weight: 500; }
  .stats-row { display: flex; justify-content: center; margin-top: 20px; }
  .stat { flex: 1; text-align: center; padding: 12px 8px; border-right: 1px solid var(--border); }
  .stat:last-child { border-right: none; }
  .stat-val { font-size: 22px; font-weight: 800; line-height: 1; margin-bottom: 4px; }
  .stat-val.green { color: var(--accent); }
  .stat-lbl { font-size: 11px; color: var(--muted); }
  .select-wrap { position: relative; }
  .req-dot { display: inline-flex; align-items: center; justify-content: center; width: 18px; height: 18px; background: var(--accent); color: #0a0a0a; border-radius: 50%; font-size: 10px; font-weight: 800; margin-left: 6px; }
</style>
</head>
<body>
<div id="app">

  <div id="screen-feed" class="screen active">
    <div class="top-bar">
      <div class="logo-row">
        <div class="logo-mark">D</div>
        <div><div class="logo-text">DI<span>B</span>S</div><div class="logo-sub">Found it. Claimed it. Built it.</div></div>
      </div>
      <div class="chips" id="feed-chips">
        <div class="chip active" data-cat="Alle">Alle</div>
        <div class="chip" data-cat="Holz">Holz</div>
        <div class="chip" data-cat="Metall">Metall</div>
        <div class="chip" data-cat="Kunststoff">Kunststoff</div>
        <div class="chip" data-cat="Textil">Textil</div>
        <div class="chip" data-cat="Sonstiges">Sonstiges</div>
      </div>
    </div>
    <div class="section-pad" style="padding-top:14px;"><div class="section-label">Aktuelle Angebote</div></div>
    <div id="feed-list"></div>
  </div>

  <div id="screen-post" class="screen">
    <div class="form-screen-header">
      <div class="screen-title">Material posten</div>
      <div class="screen-sub">Teile übrig gebliebenes Material mit anderen Betrieben.</div>
    </div>
    <div class="form-wrap">
      <div class="form-group">
        <label class="form-label">Materialbezeichnung *</label>
        <input type="text" class="form-input" id="f-title" placeholder="z.B. Fichtenbretter 2m">
      </div>
      <div class="form-row">
        <div class="form-group">
          <label class="form-label">Kategorie *</label>
          <div class="select-wrap">
            <select class="form-select" id="f-cat">
              <option value="">Wählen…</option>
              <option value="Holz">Holz</option>
              <option value="Metall">Metall</option>
              <option value="Kunststoff">Kunststoff</option>
              <option value="Textil">Textil</option>
              <option value="Sonstiges">Sonstiges</option>
            </select>
          </div>
        </div>
        <div class="form-group">
          <label class="form-label">PLZ *</label>
          <input type="text" class="form-input" id="f-plz" placeholder="z.B. 4400" maxlength="5" inputmode="numeric">
        </div>
      </div>
      <div class="form-row">
        <div class="form-group">
          <label class="form-label">Menge *</label>
          <input type="number" class="form-input" id="f-qty" placeholder="8" min="0" step="0.1">
        </div>
        <div class="form-group">
          <label class="form-label">Einheit *</label>
          <div class="select-wrap">
            <select class="form-select" id="f-unit">
              <option value="Stück">Stück</option><option value="kg">kg</option><option value="m²">m²</option>
              <option value="m">m</option><option value="Liter">Liter</option><option value="Bund">Bund</option>
            </select>
          </div>
        </div>
      </div>
      <div class="form-group">
        <label class="form-label">Beschreibung</label>
        <textarea class="form-textarea" id="f-desc" placeholder="Zustand, Maße, Besonderheiten…"></textarea>
      </div>
      <button class="btn-primary" id="btn-post"><i class="fa-solid fa-circle-check"></i> Material posten</button>
    </div>
  </div>

  <div id="screen-profile" class="screen">
    <div class="profile-header">
      <div class="avatar" id="profile-avatar">TM</div>
      <div class="profile-name" id="profile-name">—</div>
      <div class="profile-meta"><i class="fa-solid fa-location-dot"></i><span id="profile-city">—</span></div>
      <div class="stats-row">
        <div class="stat"><div class="stat-val green" id="stat-posts">0</div><div class="stat-lbl">Posts</div></div>
        <div class="stat"><div class="stat-val" id="stat-given">0</div><div class="stat-lbl">Weitergaben</div></div>
        <div class="stat"><div class="stat-val">4.8 <span style="font-size:14px;color:var(--orange)">★</span></div><div class="stat-lbl">Rating</div></div>
      </div>
    </div>
    <div class="form-screen-header" style="margin-bottom:12px;padding-left:0;padding-right:0;">
      <div class="screen-title" style="font-size:18px;">Meine Posts</div>
      <div class="screen-sub">Deine angebotenen Materialien.</div>
    </div>
    <div id="mine-list"></div>
  </div>

</div>

<script>
/* ──────────────────────────────────────────
   STATE — filled by Thunkable, never hardcoded here
────────────────────────────────────────── */
let materials = [];
let activeFilter = 'Alle';
let profile = { name: 'Tischlerei Mayer', city: 'Steyr' };

/* ──────────────────────────────────────────
   BRIDGE: THUNKABLE → WEBVIEWER
   Thunkable calls these via "Evaluate JavaScript"
────────────────────────────────────────── */
function loadMaterials(jsonString) {
  try { materials = JSON.parse(jsonString); } catch(e) { materials = []; }
  renderFeed();
  renderMine();
  updateStatPosts();
}

function setProfile(name, city) {
  profile.name = name; profile.city = city;
  document.getElementById('profile-name').textContent = name;
  document.getElementById('profile-city').textContent = city;
  document.getElementById('profile-avatar').textContent = name.split(' ').map(w=>w[0]).join('').slice(0,2).toUpperCase();
}

function navigateTo(screen) {
  document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
  document.getElementById('screen-' + screen).classList.add('active');
}
  
ThunkableWebviewerExtension.receiveMessage(function(message) {
  try {
    const obj = JSON.parse(message);
    if (Array.isArray(obj)) {
      materials = obj;
      renderFeed();
      renderMine();
      updateStatPosts();
    } else if (obj.type === 'navigate' && obj.screen) {
      navigateTo(obj.screen);
    }
  } catch(e) {
    console.error('Fehler beim Verarbeiten der Nachricht:', e);
  }
});
/* ──────────────────────────────────────────
   BRIDGE: WEBVIEWER → THUNKABLE
────────────────────────────────────────── */
function sendAction(action, payload) {
  const msg = JSON.stringify(Object.assign({ action: action }, payload));
  if (window.ThunkableWebviewerExtension) {
    ThunkableWebviewerExtension.postMessage(msg);
  } else {
    console.log('postMessage (keine Bridge vorhanden):', msg);
  }
}
/* ──────────────────────────────────────────
   FEED
────────────────────────────────────────── */
function renderFeed() {
  const list = document.getElementById('feed-list');
  const items = materials.filter(m => activeFilter === 'Alle' || m.category === activeFilter);

  if (!items.length) {
    list.innerHTML = '<div style="padding:32px;text-align:center;color:var(--muted)">Keine Materialien in dieser Kategorie</div>';
    return;
  }

  list.innerHTML = items.map((m, i) => `
    <div class="card" style="animation-delay:${i*0.05}s">
      <div class="card-header">
        <div><div class="card-title">${escHtml(m.title)}</div><div class="card-meta">${escHtml(m.postedBy)}</div></div>
        <div class="cat-badge cat-${m.category}">${m.category}</div>
      </div>
      <div class="card-qty"><i class="fa-solid fa-box"></i>${m.qty} ${m.unit}
        ${m.plz ? `<span style="margin-left:8px;color:var(--muted)"><i class="fa-solid fa-location-dot"></i> ${m.plz}</span>` : ''}
      </div>
      ${m.status === 'verfügbar'
        ? `<button class="btn-claim" data-id="${m.id}">DIBS!</button>`
        : `<button class="btn-claim sent" disabled><i class="fa-solid fa-clock"></i> ${m.status === 'reserviert' ? 'Reserviert' : 'Abgeholt'}</button>`}
    </div>
  `).join('');

  list.querySelectorAll('.btn-claim:not(.sent)').forEach(btn => {
    btn.addEventListener('click', () => {
      const id = btn.dataset.id;
      btn.disabled = true;
      btn.textContent = 'Wird gesendet…';
      sendAction('claim', { id: id });
    });
  });
}

document.querySelectorAll('#feed-chips .chip').forEach(chip => {
  chip.addEventListener('click', () => {
    document.querySelectorAll('#feed-chips .chip').forEach(c => c.classList.remove('active'));
    chip.classList.add('active');
    activeFilter = chip.dataset.cat;
    renderFeed();
  });
});

/* ──────────────────────────────────────────
   POST
────────────────────────────────────────── */
document.getElementById('btn-post').addEventListener('click', () => {
  const title = document.getElementById('f-title').value.trim();
  const category = document.getElementById('f-cat').value;
  const qty = parseFloat(document.getElementById('f-qty').value);
  const unit = document.getElementById('f-unit').value;
  const plz = document.getElementById('f-plz').value.trim();
  const description = document.getElementById('f-desc').value.trim();

  if (!title) return shakeInput('f-title');
  if (!category) return shakeInput('f-cat');
  if (!qty || qty <= 0) return shakeInput('f-qty');
  if (!plz) return shakeInput('f-plz');

  sendAction('post', { data: { title, category, qty, unit, plz, description } });

  document.getElementById('f-title').value = '';
  document.getElementById('f-cat').value = '';
  document.getElementById('f-qty').value = '';
  document.getElementById('f-plz').value = '';
  document.getElementById('f-desc').value = '';
});

function shakeInput(id) {
  const el = document.getElementById(id);
  el.style.borderColor = 'var(--red)';
  setTimeout(() => { el.style.borderColor = ''; }, 1200);
  el.focus();
}

/* ──────────────────────────────────────────
   MY POSTS
────────────────────────────────────────── */
const STATUS_NEXT_LABEL = { 'verfügbar': '→ Reserviert', 'reserviert': '→ Abgeholt', 'abgeholt': '→ Verfügbar' };

function renderMine() {
  const owned = materials.filter(m => m.postedBy === profile.name);
  const list = document.getElementById('mine-list');

  if (!owned.length) {
    list.innerHTML = '<div style="padding:32px;text-align:center;color:var(--muted)">Noch keine eigenen Posts</div>';
    return;
  }

  list.innerHTML = owned.map((m, i) => `
    <div class="my-post-card" style="animation-delay:${i*0.05}s" data-id="${m.id}">
      <div class="mp-header">
        <div class="mp-title">${escHtml(m.title)}</div>
        <span class="status-pill status-${m.status}">${m.status}</span>
      </div>
      <div class="mp-meta">${m.category} · ${m.qty} ${m.unit} · PLZ ${m.plz}
        ${m.requestCount > 0 ? `<span class="req-dot">${m.requestCount}</span>` : ''}
      </div>
      <div class="mp-actions">
        <button class="btn-sm advance" data-action="advance">${STATUS_NEXT_LABEL[m.status]}</button>
        <button class="btn-sm danger" data-action="delete"><i class="fa-regular fa-trash-can"></i></button>
      </div>
    </div>
  `).join('');

  list.querySelectorAll('[data-action]').forEach(btn => {
    btn.addEventListener('click', () => {
      const id = btn.closest('[data-id]').dataset.id;
      const action = btn.dataset.action;
      if (action === 'delete' && !confirm('Wirklich löschen?')) return;
      sendAction(action, { id: id });
    });
  });
}

function updateStatPosts() {
  document.getElementById('stat-posts').textContent = materials.filter(m => m.postedBy === profile.name).length;
}

function escHtml(s) {
  if (s == null) return '';
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

/* ──────────────────────────────────────────
   INIT — empty until Thunkable calls loadMaterials()
────────────────────────────────────────── */
setProfile(profile.name, profile.city);
renderFeed();
</script>
</body>
</html>
