<!DOCTYPE html><html lang="de"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>DIBS – Found it. Claimed it. Built it.</title><link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet"><link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css"><link rel="stylesheet" href="style.css"><script src="https://thunkable.github.io/webviewer-extension/thunkableWebviewerExtension.js"></script></head><body><div id="app">
<div id="screen-feed" class="screen active"><div class="top-bar"><div class="logo-row"><div><div class="logo-text">DI<span>B</span>S</div><div class="logo-sub">Found it. Claimed it. Built it.</div></div></div><div class="chips" id="feed-chips"></div></div><div class="section-pad" style="padding-top:14px"><div class="section-label">Aktuelle Angebote</div></div><div id="feed-list"></div></div>
<div id="screen-post" class="screen"><div class="form-screen-header"><div class="screen-title">Material posten</div><div class="screen-sub">Teile übrig gebliebenes Material mit anderen Betrieben.</div></div><div class="form-wrap"><div class="photo-slot" id="photo-slot"><img id="photo-preview" alt="" style="display:none"><div class="photo-overlay" id="photo-overlay" style="display:none"><i class="fa-solid fa-camera-rotate" style="font-size:12px;color:#fff;margin:0"></i> Foto ändern</div><div id="photo-placeholder"><i class="fa-regular fa-image"></i><p>Foto hinzufügen</p><small>Wähle eine Option</small></div></div><div class="photo-choice-row"><button class="photo-choice-btn" data-source="camera"><i class="fa-solid fa-camera"></i> Kamera</button><button class="photo-choice-btn" data-source="gallery"><i class="fa-regular fa-images"></i> Galerie</button></div>
<div class="form-group"><label class="form-label">Materialbezeichnung *</label><input class="form-input" id="f-title" placeholder="z.B. Fichtenbretter 2m"></div><div class="form-row"><div class="form-group"><label class="form-label">Kategorie *</label><div class="select-wrap"><select class="form-select" id="f-cat"></select></div></div><div class="form-group"><label class="form-label">PLZ *</label><input class="form-input" id="f-plz" placeholder="z.B. 4400" maxlength="5" inputmode="numeric"></div></div><div class="form-row"><div class="form-group"><label class="form-label">Menge *</label><input type="number" class="form-input" id="f-qty" placeholder="8" min="0" step="0.1"></div><div class="form-group"><label class="form-label">Einheit *</label><div class="select-wrap"><select class="form-select" id="f-unit"></select></div></div></div><div class="form-group"><label class="form-label">Beschreibung</label><textarea class="form-textarea" id="f-desc" placeholder="Zustand, Maße, Besonderheiten…"></textarea></div><button class="btn-primary" id="btn-post"><i class="fa-solid fa-circle-check"></i> Material posten</button></div></div>
<div id="screen-profile" class="screen"><div class="profile-header"><div class="avatar" id="profile-avatar">TM</div><div class="profile-name" id="profile-name">—</div><div class="profile-meta"><i class="fa-solid fa-location-dot" style="margin-right:12px"></i><span id="profile-city">—</span></div><div class="stats-row"><div class="stat"><div class="stat-val green" id="stat-posts">0</div><div class="stat-lbl">Posts</div></div><div class="stat"><div class="stat-val" id="stat-given">0</div><div class="stat-lbl">Weitergaben</div></div><div class="stat"><div class="stat-val">4.8 <span style="font-size:14px;color:var(--orange)">★</span></div><div class="stat-lbl">Rating</div></div></div></div><div class="form-screen-header" style="margin-bottom:12px;padding:16px 28px 0"><div class="screen-title" style="font-size:18px">Meine Posts</div><div class="screen-sub">Deine angebotenen Materialien.</div></div><div id="mine-list"></div></div>
<nav class="bottom-nav"><div class="nav-item active"><i class="fa-solid fa-house"></i><span>Feed</span></div><div class="nav-item post-btn"><i class="fa-solid fa-plus-circle"></i><span>Posten</span></div><div class="nav-item"><i class="fa-regular fa-user"></i><span>Profil</span></div></nav>
</div><script src="script.js"></script></body></html>
